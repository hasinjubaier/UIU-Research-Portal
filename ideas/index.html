<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innovation Hub — UIU Research Portal</title>
<link rel="stylesheet" href="../assets/css/global.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/animations.css">
<style>
.idea-card { background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-xl);padding:var(--space-6);transition:all var(--dur-mid) var(--ease);display:flex;flex-direction:column;gap:var(--space-4); }
.idea-card:hover { border-color:var(--border-hover);box-shadow:var(--shadow-accent);transform:translateY(-3px); }
.upvote-btn { display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg-input);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:10px 14px;cursor:pointer;transition:all var(--dur-fast);flex-shrink:0; }
.upvote-btn:hover,.upvote-btn.voted { background:var(--accent-glow);border-color:var(--border-hover);color:var(--accent); }
.upvote-num { font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem; }
.upvote-arrow { font-size:1.1rem;line-height:1; }
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <div id="topbarMount"></div>
    <div class="page-content page-enter">

      <div class="page-header">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-4);">
          <div>

            <h2>Innovation Hub</h2>
            <p>Post, discover, and collaborate on innovative research ideas</p>
          </div>
          <button class="btn btn-primary" data-modal-open="postIdeaModal">Post an Idea</button>
        </div>
      </div>

      <!-- Sort & search -->
      <div style="display:flex;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap;">
        <div class="search-bar" style="flex:1;max-width:480px;"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><input type="text" placeholder="Search ideas, domains, skills…" id="ideaSearch"></div>
        <div class="tabs" style="height:fit-content;" data-tabs>
          <div class="tab-item active" data-tab="trending">Trending</div>
          <div class="tab-item" data-tab="new">Newest</div>
          <div class="tab-item" data-tab="open">Open</div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-row mb-8">
        <div class="stat-card">
          <div class="stat-card-icon accent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="17" height="17">
              <path d="M9 3h6M10 3v6l-4 10a1 1 0 0 0 .9 1.4h10.2A1 1 0 0 0 18 19L14 9V3"/><path d="M7.5 14h9"/>
            </svg>
          </div>
          <div class="stat-number" data-count="120">0</div>
          <div class="stat-label">Ideas Posted</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="17" height="17">
              <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
            </svg>
          </div>
          <div class="stat-number" data-count="3800">0</div>
          <div class="stat-label">Total Upvotes</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="17" height="17">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
            </svg>
          </div>
          <div class="stat-number" data-count="45">0</div>
          <div class="stat-label">Ideas Turned Projects</div>
        </div>
      </div>

      <!-- Idea list -->
      <div style="display:flex;flex-direction:column;gap:var(--space-5);" id="ideaList"></div>

    </div>
  </div>
</div>

<!-- Post Idea Modal -->
<div class="modal-overlay" id="postIdeaModal">
  <div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title">Post Research Idea</div><span class="modal-close" data-modal-close="postIdeaModal">&times;</span></div>
    <div style="display:flex;flex-direction:column;gap:var(--space-5);">
      <div class="form-group"><label class="form-label">Idea Title</label><input class="form-input" placeholder="e.g. AI-based Traffic Signal Optimization for Dhaka"></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" placeholder="Describe your research idea in detail…"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);">
        <div class="form-group"><label class="form-label">Domain</label><select class="form-input"><option>AI / Machine Learning</option><option>IoT</option><option>Blockchain</option><option>NLP</option><option>Healthcare</option><option>Other</option></select></div>
        <div class="form-group"><label class="form-label">Skills Needed</label><input class="form-input" placeholder="e.g. Python, Computer Vision"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-modal-close="postIdeaModal">Cancel</button>
      <button class="btn btn-primary" onclick="Modal.close('postIdeaModal');Toast.show('Idea posted to the marketplace! ','success')">Post Idea</button>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.getElementById('sidebarMount').outerHTML = buildSidebar('ideas');
document.getElementById('topbarMount').outerHTML  = buildTopbar('Innovation Hub','ideas');

function renderIdeas(list) {
  const el = document.getElementById('ideaList');
  el.innerHTML = '';
  list.forEach((idea, i) => {
    const s = DATA.getStudent(idea.author);
    el.innerHTML += `
    <div class="idea-card reveal delay-${i%3}">
      <div style="display:flex;gap:var(--space-4);">
        <button class="upvote-btn" id="upvote-${idea.id}" onclick="toggleUpvote(${idea.id}, ${idea.upvotes})">
          <span class="upvote-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13" style="margin-bottom:2px;"><polyline points="18 15 12 9 6 15"/></svg></span>
          <span class="upvote-num" id="upvote-num-${idea.id}">${idea.upvotes}</span>
        </button>
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2);flex-wrap:wrap;">
            <h4 style="margin:0;flex:1;">${idea.title}</h4>
            <span class="badge badge-${idea.status==='Open'?'green':'accent'}">${idea.status}</span>
          </div>
          <span class="badge badge-purple mb-3">${idea.domain}</span>
          <p style="font-size:.875rem;color:var(--text-secondary);line-height:1.7;margin-bottom:var(--space-3);">${idea.description}</p>
          <div style="margin-bottom:var(--space-3);">
            <span style="font-size:.8rem;color:var(--text-muted);">Skills needed: </span>
            ${idea.skills.map(sk=>`<span class="tag" style="margin:2px;">${sk}</span>`).join('')}
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);">
            <div style="display:flex;align-items:center;gap:var(--space-3);font-size:.8rem;color:var(--text-muted);">
              <div style="display:flex;align-items:center;gap:6px;">
                <div class="avatar-placeholder" style="width:22px;height:22px;font-size:.55rem;border-radius:50%;background:var(--accent-glow);color:var(--accent);">${s.initials}</div>
                ${s.name}
              </div>
              <span>${idea.date}</span>
              <span>${idea.comments} comments</span>
            </div>
            <div style="display:flex;gap:var(--space-2);">
              <button class="btn btn-primary btn-sm" onclick="Toast.show('Join request sent for: ${idea.title}','success')">Join</button>
              <button class="btn btn-ghost btn-sm" onclick="Toast.show('Comment feature — coming with backend!','info')">Comment</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  });
  ScrollReveal.init();
}

renderIdeas(DATA.ideas);

function toggleUpvote(id, base) {
  const btn = document.getElementById(`upvote-${id}`);
  const num = document.getElementById(`upvote-num-${id}`);
  const voted = btn.classList.toggle('voted');
  num.textContent = voted ? base+1 : base;
  if(voted) Toast.show('Upvoted! ','success');
}

document.getElementById('ideaSearch').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  renderIdeas(DATA.ideas.filter(i=>i.title.toLowerCase().includes(q)||i.domain.toLowerCase().includes(q)||i.description.toLowerCase().includes(q)));
});
</script>
</body>
</html>
