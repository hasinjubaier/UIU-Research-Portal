<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events & Opportunities — UIU Research Portal</title>
<link rel="stylesheet" href="../assets/css/global.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/animations.css">
<style>
.event-card { background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-xl);overflow:hidden;transition:all var(--dur-mid) var(--ease);display:flex;flex-direction:column; }
.event-card:hover { border-color:var(--border-hover);box-shadow:var(--shadow-accent);transform:translateY(-3px); }
.event-card-banner { height:120px;position:relative;display:flex;align-items:center;padding:var(--space-5);overflow:hidden; }
.event-card-banner::before { content:'';position:absolute;inset:0;background:var(--grad); }
.event-card-body { padding:var(--space-5);flex:1;display:flex;flex-direction:column;gap:var(--space-3); }
.event-title { font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;line-height:1.3; }
.event-info-row { display:flex;align-items:center;gap:var(--space-2);font-size:.8rem;color:var(--text-muted); }
.event-bar { height:5px;background:var(--bg-input);border-radius:var(--radius-full);overflow:hidden; }
.event-bar-fill { height:100%;border-radius:var(--radius-full);background:linear-gradient(90deg,var(--accent),var(--purple)); }
.countdown { display:flex;gap:var(--space-3);margin-bottom:var(--space-3); }
.countdown-unit { text-align:center;background:var(--bg-surface);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4); }
.countdown-num  { font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.6rem;line-height:1; }
.countdown-lbl  { font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px; }
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <div id="topbarMount"></div>
    <div class="page-content page-enter">

      <div class="page-header">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-4);">
          <div>

            <h2>Events & Opportunities</h2>
            <p>Hackathons, conferences, workshops, and research competitions</p>
          </div>
          <button class="btn btn-primary" data-modal-open="postEventModal"> Post Event</button>
        </div>
      </div>

      <!-- Featured event countdown -->
      <div class="card mb-8" style="background:linear-gradient(135deg,rgba(79,142,247,.1),rgba(124,58,237,.1));border-color:var(--border-hover);">
        <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);">
          <span style="font-size:1.5rem;"></span>
          <div>
            <span class="badge badge-orange">Closing Soon!</span>
            <div class="card-title mt-1">UIU National Hackathon 2025</div>
            <div style="font-size:.8rem;color:var(--text-muted);">June 14-15 · UIU Campus · Prize: ৳2,00,000</div>
          </div>
        </div>
        <div style="font-size:.875rem;color:var(--text-secondary);margin-bottom:var(--space-5);">Registration closes in:</div>
        <div class="countdown" id="countdown">
          <div class="countdown-unit"><div class="countdown-num" id="cd-days">42</div><div class="countdown-lbl">Days</div></div>
          <div class="countdown-unit"><div class="countdown-num" id="cd-hours">08</div><div class="countdown-lbl">Hours</div></div>
          <div class="countdown-unit"><div class="countdown-num" id="cd-mins">35</div><div class="countdown-lbl">Mins</div></div>
          <div class="countdown-unit"><div class="countdown-num" id="cd-secs">00</div><div class="countdown-lbl">Secs</div></div>
        </div>
        <button class="btn btn-primary" onclick="Toast.show('Registered for UIU Hackathon! Check your email for confirmation ','success')"> Register Now</button>
      </div>

      <!-- Filter row -->
      <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-6);" id="eventTypePills">
        <button class="cat-btn active" style="background:var(--bg-input);border:1px solid var(--border-card);border-radius:var(--radius-full);padding:8px 18px;font-size:.8rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all var(--dur-fast);" data-type="all">All Events</button>
        <button class="cat-btn" style="background:var(--bg-input);border:1px solid var(--border-card);border-radius:var(--radius-full);padding:8px 18px;font-size:.8rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all var(--dur-fast);" data-type="Hackathon"> Hackathons</button>
        <button class="cat-btn" style="background:var(--bg-input);border:1px solid var(--border-card);border-radius:var(--radius-full);padding:8px 18px;font-size:.8rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all var(--dur-fast);" data-type="Competition"> Competitions</button>
        <button class="cat-btn" style="background:var(--bg-input);border:1px solid var(--border-card);border-radius:var(--radius-full);padding:8px 18px;font-size:.8rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all var(--dur-fast);" data-type="Workshop"> Workshops</button>
        <button class="cat-btn" style="background:var(--bg-input);border:1px solid var(--border-card);border-radius:var(--radius-full);padding:8px 18px;font-size:.8rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all var(--dur-fast);" data-type="Conference"> Conferences</button>
      </div>

      <div class="grid-2" id="eventsGrid"></div>

    </div>
  </div>
</div>

<!-- Post Event Modal -->
<div class="modal-overlay" id="postEventModal">
  <div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title"> Post Event</div><span class="modal-close" data-modal-close="postEventModal">&times;</span></div>
    <div style="display:flex;flex-direction:column;gap:var(--space-5);">
      <div class="form-group"><label class="form-label">Event Title</label><input class="form-input" placeholder="Event name"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);">
        <div class="form-group"><label class="form-label">Type</label><select class="form-input"><option>Hackathon</option><option>Competition</option><option>Workshop</option><option>Conference</option></select></div>
        <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date"></div>
        <div class="form-group"><label class="form-label">Location</label><input class="form-input" placeholder="Venue or Virtual"></div>
        <div class="form-group"><label class="form-label">Prize / Fee</label><input class="form-input" placeholder="e.g. ৳50,000 or Free"></div>
      </div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" placeholder="Describe the event…"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-modal-close="postEventModal">Cancel</button>
      <button class="btn btn-primary" onclick="Modal.close('postEventModal');Toast.show('Event posted successfully! ','success')">Post Event</button>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.getElementById('sidebarMount').outerHTML = buildSidebar('events');
document.getElementById('topbarMount').outerHTML  = buildTopbar('Events','events');

const eventGrad = { Hackathon:'linear-gradient(135deg,var(--accent),var(--purple))', Competition:'linear-gradient(135deg,var(--orange),var(--red))', Workshop:'linear-gradient(135deg,var(--teal),var(--green))', Conference:'linear-gradient(135deg,var(--purple),var(--teal))' };

function renderEvents(list) {
  const grid = document.getElementById('eventsGrid');
  grid.innerHTML='';
  list.forEach((ev,i)=>{
    const pct = Math.round(ev.participants/ev.spots*100);
    grid.innerHTML+=`
    <div class="event-card reveal delay-${i%3}">
      <div class="event-card-banner" style="--grad:${eventGrad[ev.type]||'linear-gradient(135deg,var(--accent),var(--purple))'};color:#fff;position:relative;z-index:1;">
        <div>
          <span class="badge" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.2);">${ev.type}</span>
          ${ev.status==='closing-soon'?'<span class="badge" style="background:rgba(245,158,11,.3);color:var(--orange);border:1px solid rgba(245,158,11,.3);margin-left:4px;"> Closing Soon</span>':''}
        </div>
      </div>
      <div class="event-card-body">
        <div class="event-title">${ev.title}</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <div class="event-info-row"> ${new Date(ev.date).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}${ev.endDate?' – '+new Date(ev.endDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</div>
          <div class="event-info-row"> ${ev.location}</div>
          ${ev.prize?`<div class="event-info-row"> Prize: ${ev.prize}</div>`:''}
          <div class="event-info-row"> ${ev.organizer}</div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">${ev.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div>
          <div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-muted);margin-bottom:4px;"><span>Participants</span><span>${ev.participants} / ${ev.spots}</span></div>
          <div class="event-bar"><div class="event-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <button class="btn btn-primary btn-block btn-sm" onclick="Toast.show('Registered for ${ev.title}! ','success')"> Register / Apply</button>
      </div>
    </div>`;
  });
  ScrollReveal.init();
}

renderEvents(DATA.events);

document.querySelectorAll('[data-type]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-type]').forEach(b=>{b.classList.remove('active');b.style.background='var(--bg-input)';b.style.color='var(--text-secondary)';b.style.borderColor='var(--border-card)';});
    btn.classList.add('active');btn.style.background='var(--accent-glow)';btn.style.color='var(--accent)';btn.style.borderColor='var(--border-hover)';
    const t=btn.dataset.type;
    renderEvents(t==='all'?DATA.events:DATA.events.filter(e=>e.type===t));
  });
});

// Countdown
function updateCountdown(){
  const target=new Date('2025-06-01T23:59:00');
  const now=new Date();
  const diff=target-now;
  if(diff<0) return;
  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  document.getElementById('cd-days').textContent=String(d).padStart(2,'0');
  document.getElementById('cd-hours').textContent=String(h).padStart(2,'0');
  document.getElementById('cd-mins').textContent=String(m).padStart(2,'0');
  document.getElementById('cd-secs').textContent=String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
