<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Hub — UIU Research Portal</title>
<link rel="stylesheet" href="../assets/css/global.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/animations.css">
<style>
.resource-card { background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-xl);padding:var(--space-5);transition:all var(--dur-mid) var(--ease);display:flex;flex-direction:column;gap:var(--space-3); }
.resource-card:hover { border-color:var(--border-hover);box-shadow:var(--shadow-accent);transform:translateY(-3px); }
.resource-type-icon { width:46px;height:46px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0; }
.star-rating { color:var(--orange);font-size:.85rem; }
.cat-btn { background:var(--bg-input);border:1px solid var(--border-card);border-radius:var(--radius-full);padding:8px 18px;font-size:.8rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all var(--dur-fast);white-space:nowrap; }
.cat-btn:hover,.cat-btn.active { background:var(--accent-glow);color:var(--accent);border-color:var(--border-hover); }
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <div id="topbarMount"></div>
    <div class="page-content page-enter">
      <div class="page-header">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-4);">
          <div>
            <h2>Research Resource Hub</h2>
            <p>Discover and share academic papers, PDFs, and study materials</p>
          </div>
          <button class="btn btn-primary" data-modal-open="uploadModal">Upload Resource</button>
        </div>
      </div>

      <!-- Search -->
      <div style="display:flex;gap:var(--space-4);margin-bottom:var(--space-5);flex-wrap:wrap;">
        <div class="search-bar" style="flex:1;max-width:500px;">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input type="text" placeholder="Search resources, topics, authors…" id="resourceSearch">
        </div>
        <select class="form-input" style="width:auto;">
          <option>Sort: Most Downloaded</option>
          <option>Sort: Highest Rated</option>
          <option>Sort: Newest</option>
        </select>
      </div>

      <!-- Category pills -->
      <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-6);" id="catPills">
        <button class="cat-btn active" data-cat="all">All Resources</button>
        <button class="cat-btn" data-cat="AI/ML">AI / ML</button>
        <button class="cat-btn" data-cat="NLP">NLP</button>
        <button class="cat-btn" data-cat="Web Dev">Web Dev</button>
        <button class="cat-btn" data-cat="EEE">EEE</button>
        <button class="cat-btn" data-cat="CS">CS</button>
        <button class="cat-btn" data-cat="Statistics">Statistics</button>
      </div>

      <!-- Stats -->
      <div class="stats-row mb-6">
        <div class="stat-card">
          <div class="stat-card-icon accent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="17" height="17">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </div>
          <div class="stat-number" data-count="850">0</div>
          <div class="stat-label">Total Resources</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="17" height="17">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </div>
          <div class="stat-number" data-count="12400">0</div>
          <div class="stat-label">Total Downloads</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="17" height="17">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div class="stat-number" data-count="420">0</div>
          <div class="stat-label">Contributors</div>
        </div>
      </div>

      <!-- Recommendations -->
      <div class="card mb-6" style="background:linear-gradient(135deg,rgba(79,142,247,.08),rgba(124,58,237,.08));border-color:var(--border-hover);">
        <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);">
          <span style="font-size:1.5rem;"></span>
          <div><div class="card-title">Recommended for You</div><div style="font-size:.8rem;color:var(--text-muted);">Based on your interests in AI & Healthcare</div></div>
        </div>
        <div style="display:flex;gap:var(--space-3);overflow-x:auto;padding-bottom:var(--space-2);" id="recommended"></div>
      </div>

      <!-- Resource grid -->
      <div class="grid-3" id="resourceGrid"></div>

    </div>
  </div>
</div>

<!-- Upload Modal -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title">Upload Resource</div><span class="modal-close" data-modal-close="uploadModal">&times;</span></div>
    <div style="display:flex;flex-direction:column;gap:var(--space-5);">
      <div class="upload-zone" onclick="Toast.show('File picker — ready for backend!','info')">
        <div class="upload-icon"></div>
        <div style="font-weight:600;margin-bottom:4px;">Click or drag file here</div>
        <div style="font-size:.8rem;color:var(--text-muted);">PDF, DOCX, PPTX — Max 50MB</div>
      </div>
      <div class="form-group"><label class="form-label">Title</label><input class="form-input" placeholder="Resource title"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);">
        <div class="form-group"><label class="form-label">Type</label><select class="form-input"><option>Paper</option><option>Study Material</option><option>PDF</option><option>Tutorial</option></select></div>
        <div class="form-group"><label class="form-label">Category</label><select class="form-input"><option>AI/ML</option><option>NLP</option><option>Web Dev</option><option>EEE</option><option>Statistics</option></select></div>
      </div>
      <div class="form-group"><label class="form-label">Tags <span style="color:var(--text-muted);">(comma-separated)</span></label><input class="form-input" placeholder="e.g. Deep Learning, CNN, Healthcare"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-modal-close="uploadModal">Cancel</button>
      <button class="btn btn-primary" onclick="Modal.close('uploadModal');Toast.show('Resource uploaded successfully! ','success')">Upload</button>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.getElementById('sidebarMount').outerHTML = buildSidebar('resources');
document.getElementById('topbarMount').outerHTML  = buildTopbar('Resource Hub','resources');

const typeIcons = {
  Paper: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  'Study Material': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  PDF: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
  Tutorial: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="18" height="18"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`
};
const typeColors = {Paper:'accent','Study Material':'purple',PDF:'green',Tutorial:'teal'};

function renderResources(list) {
  const grid = document.getElementById('resourceGrid');
  grid.innerHTML = '';
  list.forEach(r => {
    const stars = ''.repeat(Math.floor(r.rating)) + (r.rating%1>=.5?'½':'');
    grid.innerHTML += `
    <div class="resource-card reveal">
      <div style="display:flex;align-items:flex-start;gap:var(--space-3);">
        <div class="resource-type-icon" style="background:var(--${typeColors[r.type]||'accent'}-glow,rgba(79,142,247,.1)); color:var(--${typeColors[r.type]||'accent'});">${typeIcons[r.type]||''}</div>
        <div style="flex:1;min-width:0;">
          <span class="badge badge-${typeColors[r.type]||'accent'} mb-1">${r.type}</span>
          <div style="font-weight:600;font-size:.95rem;line-height:1.3;">${r.title}</div>
          <div style="font-size:.75rem;color:var(--text-muted);margin-top:2px;">By ${r.author} · ${r.category}</div>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div><span class="star-rating">${'★'.repeat(Math.floor(r.rating))}${'☆'.repeat(5-Math.floor(r.rating))}</span> <span style="font-size:.75rem;color:var(--text-muted);">${r.rating}</span></div>
        <span style="font-size:.75rem;color:var(--text-muted);"> ${r.downloads} · ${r.size}</span>
      </div>
      <div style="display:flex;gap:var(--space-2);margin-top:auto;">
        <button class="btn btn-primary btn-sm" style="flex:1;" onclick="Toast.show('Downloading ${r.title}…','info')"> Download</button>
        <button class="btn btn-ghost btn-sm" onclick="Toast.show('Saved to bookmarks!','success')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
      </div>
    </div>`;
  });
  ScrollReveal.init();
}

renderResources(DATA.resources);

// Recommended strip
const rec = document.getElementById('recommended');
DATA.resources.slice(0,3).forEach(r=>{
  rec.innerHTML+=`<div style="min-width:220px;background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:var(--space-4);flex-shrink:0;">
    <div style="font-weight:600;font-size:.85rem;margin-bottom:4px;">${r.title.slice(0,40)}…</div>
    <div style="font-size:.72rem;color:var(--text-muted);"> ${r.downloads} downloads · ${r.rating}</div>
    <button class="btn btn-ghost btn-sm mt-3" onclick="Toast.show('Downloading…','info')" style="width:100%;">Download</button>
  </div>`;
});

// Category filter
document.querySelectorAll('.cat-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.cat;
    renderResources(cat==='all'?DATA.resources:DATA.resources.filter(r=>r.category===cat));
  });
});

// Search
document.getElementById('resourceSearch').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  renderResources(DATA.resources.filter(r=>r.title.toLowerCase().includes(q)||r.tags.some(t=>t.toLowerCase().includes(q))||r.author.toLowerCase().includes(q)));
});
</script>
</body>
</html>
